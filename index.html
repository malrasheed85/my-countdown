<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Countdown</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Countdown">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#E6E6EC;--text:#111318;--muted:#6B6E76;
  --border:rgba(0,0,0,.08);--accent:#111318;--onaccent:#FFFFFF;--danger:#D93036;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--text:#F2F2F7;--muted:#9A9AA2;
  --border:rgba(255,255,255,.10);--accent:#F2F2F7;--onaccent:#111318;--danger:#FF5A5F}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif}
body{min-height:100vh;padding-top:var(--safe-t)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;font-size:16px;color:var(--text)}
.hidden{display:none !important}

#login{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#login img{width:96px;height:96px;border-radius:24px}
#login h1{margin:0;font-size:28px;font-weight:800}
#login p{margin:0;color:var(--muted)}
.btn-main{background:var(--accent);color:var(--onaccent);border-radius:14px;padding:12px 22px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header h1{margin:0;font-size:24px;font-weight:800}
.hbtns{display:flex;gap:6px}
.round{width:40px;height:40px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:20px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--accent);color:var(--onaccent)}

#searchRow{padding:0 16px 8px}
#searchRow input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}

#list{padding:4px 12px calc(110px + var(--safe-b))}
.card{display:flex;align-items:stretch;border-radius:20px;overflow:hidden;margin-bottom:10px;color:#fff;background:var(--c);min-height:88px;width:100%;text-align:right}
.card .ic{width:66px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px}
.card .ic .em{font-size:32px;line-height:1}
.card .tx{flex:1;min-width:0;padding:12px 2px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.card .nm{font-size:18px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sb{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{font-size:13px;opacity:.9;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.card .num{width:88px;flex:none;background:rgba(0,0,0,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.card .num b{font-size:34px;font-weight:800;line-height:1}
.card .num b.sm{font-size:22px}
.card .num span{font-size:12px;opacity:.9;margin-top:2px}
.card.past{filter:saturate(.35);opacity:.8}
.renew{margin-top:6px;align-self:flex-start;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:#fff}

.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty i{font-size:44px;display:block;margin-bottom:8px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + var(--safe-b));display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px}
.seg button{padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.fab{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-size:26px;display:inline-flex;align-items:center;justify-content:center}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(24px + var(--safe-b));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shead h2{margin:0;font-size:18px;font-weight:700}
.save{color:var(--onaccent);background:var(--accent)}
.box{background:var(--surface);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.row+.row{border-top:1px solid var(--border)}
.row label,.lbl{color:var(--muted);font-size:14px}
.row input[type=date],.row input[type=time],.row select,.row input[type=number]{background:var(--surface2);border:0;border-radius:10px;padding:6px 10px;min-height:36px}
.row input[type=number]{width:70px;text-align:center}
.titlebox{display:flex;align-items:center;gap:12px;padding:10px 0}
.iconbtn{width:58px;height:58px;flex:none;border-radius:16px;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;background:var(--c)}
.iconbtn .em{font-size:30px}
.titlebox .f{flex:1;display:flex;flex-direction:column}
.titlebox input{border:0;background:none;padding:4px 0;outline:none}
.titlebox input.t{font-size:18px;font-weight:700}
.titlebox input.s{font-size:14px;color:var(--muted)}
.lbl{display:block;margin:4px 4px 8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.wrap .chip{background:var(--surface)}
.wrap .chip.on{background:var(--accent);color:var(--onaccent)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface2);position:relative;flex:none}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s}
.switch.on{background:#30A46C}
.switch.on::after{right:23px}
.segfull{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:8px}
.segfull button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.segfull button.on{background:var(--surface2);color:var(--text)}
.hint{font-size:13px;color:var(--muted);margin:2px 4px 12px}
.err{color:var(--danger);font-size:13px;margin:-4px 4px 10px}
.del{width:100%;padding:12px;border-radius:14px;background:var(--surface);color:var(--danger);font-weight:700;margin-top:4px}

.ptabs{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:12px}
.ptabs button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.ptabs button.on{background:var(--surface2);color:var(--text)}
.psec{font-size:14px;color:var(--muted);margin:10px 4px 8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.pgrid button{aspect-ratio:1;border-radius:14px;background:var(--surface);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pgrid button small{font-size:10px;color:var(--muted)}
.pgrid button.on{outline:2.5px solid var(--accent)}
.emoji-in{width:100%;padding:14px;border-radius:14px;border:0;background:var(--surface);font-size:32px;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60}
:focus-visible{outline:2.5px solid #3E8BD8;outline-offset:2px}
#app{max-width:600px;margin:0 auto}
.bar{max-width:600px;margin:0 auto}
.round.on{background:#2F9E68;color:#fff}
</style>
</head>
<body>

<section id="login" class="hidden">
  <img src="icon-192.png" alt="">
  <h1>My Countdown</h1>
  <p>كل مواعيدك المهمة، وكم باقي عليها</p>
  <button class="btn-main" id="loginBtn"><i class="ti ti-brand-google"></i> الدخول بحساب Google</button>
  <p id="loginErr" class="err hidden"></p>
</section>

<section id="app" class="hidden">
  <header>
    <h1>مواعيدي</h1>
    <div class="hbtns">
      <button class="round" id="notifBtn" aria-label="الإشعارات"><i class="ti ti-bell-off"></i></button>
      <button class="round" id="settingsBtn" aria-label="الإعدادات"><i class="ti ti-settings"></i></button>
    </div>
  </header>
  <div class="chips" id="filters"></div>
  <div id="searchRow" class="hidden"><input id="searchIn" type="search" placeholder="ابحث باسم الموعد"></div>
  <main id="list"></main>
  <div class="bar">
    <button class="round" id="searchBtn" aria-label="بحث"><i class="ti ti-search"></i></button>
    <div class="seg">
      <button id="tabUp" class="on">قادم <span id="cUp">0</span></button>
      <button id="tabPast">منتهي <span id="cPast">0</span></button>
    </div>
    <button class="fab" id="addBtn" aria-label="موعد جديد"><i class="ti ti-plus"></i></button>
  </div>
</section>

<div id="sheetHost"></div>
<div id="toast" class="hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const VAPID_KEY = "BGfPBLx_y3IoAoOkZ58slQkLWztU1DLJiX0Z_KcTWg7BbyP1ln7K6o-G-reKeCB5gd7RER67dvddfsYAH29dECY";

const firebaseConfig = {
  apiKey: "AIzaSyDNoYzwHYN_DfRBOUZirvrU9li64Nd535M",
  authDomain: "my-countdown-f73ed.firebaseapp.com",
  databaseURL: "https://my-countdown-f73ed-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "my-countdown-f73ed",
  storageBucket: "my-countdown-f73ed.firebasestorage.app",
  messagingSenderId: "533660446836",
  appId: "1:533660446836:web:ba20cf3b0abf4777c02121"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

const CATS = [
  { id: 'car',      name: 'سيارة',    color: '#E5484D', icon: 'car' },
  { id: 'work',     name: 'عمل',      color: '#8E4EC6', icon: 'briefcase' },
  { id: 'home',     name: 'شقة',      color: '#3E8BD8', icon: 'building' },
  { id: 'subs',     name: 'اشتراكات', color: '#2F9E68', icon: 'device-mobile' },
  { id: 'personal', name: 'شخصي',     color: '#E8732A', icon: 'user' },
  { id: 'family',   name: 'عائلة',    color: '#D6409F', icon: 'users' }
];
const catById = id => CATS.find(c => c.id === id) || CATS[4];

const LIB = [
  { sec: 'سيارة', items: ['car','file-certificate','shield-check','tool','battery-automotive','droplet','id','steering-wheel','gas-station','parking'] },
  { sec: 'عمل', items: ['briefcase','certificate','calendar-event','file-text','school','book'] },
  { sec: 'شقة', items: ['building','home','key','receipt','bolt','wifi','spray'] },
  { sec: 'اشتراكات', items: ['device-mobile','device-desktop','cloud','credit-card','music','movie'] },
  { sec: 'شخصي', items: ['scissors','bath','heartbeat','pill','stethoscope','dental','eye','barbell','run','shirt','plane','world'] },
  { sec: 'عامة', items: ['cash','gift','cake','star','bell','trophy','moon','building-mosque','sun','shopping-cart','paw'] }
];
const FAMILY = [
  { e: '👩', n: 'أم' }, { e: '👨', n: 'أب' }, { e: '🧔', n: 'أخ' }, { e: '🧕', n: 'أخت' }, { e: '👧', n: 'بنت' }
];

const ALERT_OPTS = [
  { d: 0, n: 'يوم الموعد' }, { d: 1, n: 'قبل يوم' }, { d: 3, n: 'قبل 3 أيام' }, { d: 7, n: 'قبل أسبوع' },
  { d: 14, n: 'قبل أسبوعين' }, { d: 30, n: 'قبل شهر' }, { d: 60, n: 'قبل شهرين' }, { d: 90, n: 'قبل 3 شهور' }
];
const UNITS = { day: ['يوم', 'أيام'], week: ['أسبوع', 'أسابيع'], month: ['شهر', 'شهور'], year: ['سنة', 'سنوات'] };

let uid = null, events = {}, filter = 'all', tab = 'up', query = '', unsub = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYMD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayYMD() { return ymd(new Date()); }
function dayDiff(fromYMD, toYMD) { return Math.round((parseYMD(toYMD) - parseYMD(fromYMD)) / 86400000); }
function addInterval(s, every, unit) {
  const d = parseYMD(s), n = Math.max(1, Number(every) || 1);
  if (unit === 'day') d.setDate(d.getDate() + n);
  else if (unit === 'week') d.setDate(d.getDate() + 7 * n);
  else {
    const months = unit === 'year' ? 12 * n : n;
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
  }
  return ymd(d);
}
const fmtDate = new Intl.DateTimeFormat('ar-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function prettyDate(e) {
  let s = fmtDate.format(parseYMD(e.date));
  if (e.time) s += ' · ' + e.time;
  return s;
}
function repeatLabel(r) {
  if (!r || r.mode === 'none') return '';
  if (r.mode === 'manual') return 'تجديد يدوي';
  const n = Number(r.every) || 1, u = UNITS[r.unit] || UNITS.year;
  if (n === 1) return 'كل ' + u[0];
  if (n === 2 && r.unit === 'month') return 'كل شهرين';
  if (n === 2 && r.unit === 'year') return 'كل سنتين';
  return `كل ${n} ${n <= 10 ? u[1] : u[0]}`;
}
function iconHTML(ic) {
  if (!ic) return '<i class="ti ti-clock"></i>';
  if (ic.t === 'em') return `<span class="em">${esc(ic.v)}</span>`;
  return `<i class="ti ti-${esc(ic.v)}"></i>`;
}
function word(n, one, two, few, many) {
  n = Math.abs(n);
  if (n === 1) return one;
  if (n === 2) return two;
  if (n >= 3 && n <= 10) return few;
  return many;
}
function countdown(e) {
  const days = dayDiff(todayYMD(), e.date);
  if (e.showHours) {
    const [y, m, d] = e.date.split('-').map(Number);
    const [hh, mm] = (e.time || '00:00').split(':').map(Number);
    let hrs = Math.round((new Date(y, m - 1, d, hh, mm) - new Date()) / 3600000);
    if (days >= 0) hrs = Math.max(0, hrs);
    const w = word(hrs, 'ساعة', 'ساعتين', 'ساعات', 'ساعة');
    return { days, big: String(Math.abs(hrs)), unit: days < 0 ? 'مضت' : w };
  }
  if (days === 0) return { days, big: 'اليوم', unit: '', small: true };
  const w = word(days, 'يوم', 'يومين', 'أيام', 'يوم');
  return { days, big: String(Math.abs(days)), unit: days < 0 ? w + ' مضت' : w };
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.add('hidden'), 1800);
}

function rollAutoEvents() {
  const today = todayYMD();
  Object.entries(events).forEach(([id, e]) => {
    if (e.repeat?.mode !== 'auto' || !e.date) return;
    let d = e.date, guard = 0;
    while (dayDiff(today, d) < 0 && guard++ < 1000) d = addInterval(d, e.repeat.every, e.repeat.unit);
    if (d !== e.date) update(ref(db, `users/${uid}/events/${id}`), { date: d, updatedAt: Date.now() });
  });
}

function renderFilters() {
  const all = [{ id: 'all', name: 'الكل' }, ...CATS];
  $('#filters').innerHTML = all.map(c =>
    `<button class="chip ${filter === c.id ? 'on' : ''}" data-f="${c.id}">${c.color ? `<span class="dot" style="background:${c.color}"></span>` : ''}${c.name}</button>`
  ).join('');
}

function render() {
  const today = todayYMD();
  const arr = Object.entries(events).map(([id, e]) => ({ id, ...e })).filter(e => e.date);
  const up = arr.filter(e => dayDiff(today, e.date) >= 0);
  const past = arr.filter(e => dayDiff(today, e.date) < 0);
  $('#cUp').textContent = up.length;
  $('#cPast').textContent = past.length;
  let list = tab === 'up' ? up : past;
  if (filter !== 'all') list = list.filter(e => e.category === filter);
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(e => (e.title || '').toLowerCase().includes(q) || (e.subtitle || '').toLowerCase().includes(q));
  }
  list.sort((a, b) => tab === 'up'
    ? (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))
    : (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));

  if (!list.length) {
    const msg = arr.length === 0
      ? '<i class="ti ti-calendar-plus"></i>أضف أول موعد من زر +'
      : tab === 'up' ? '<i class="ti ti-mood-smile"></i>ما فيه مواعيد قادمة هنا' : '<i class="ti ti-archive"></i>ما فيه مواعيد منتهية هنا';
    $('#list').innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  $('#list').innerHTML = list.map(e => {
    const c = catById(e.category), cd = countdown(e), rl = repeatLabel(e.repeat);
    const isPast = cd.days < 0;
    return `<div class="card ${isPast ? 'past' : ''}" style="--c:${c.color}" data-id="${e.id}" role="button" tabindex="0">
      <div class="ic">${iconHTML(e.icon)}</div>
      <div class="tx">
        <div class="nm">${esc(e.title)}</div>
        ${e.subtitle ? `<div class="sb">${esc(e.subtitle)}</div>` : ''}
        <div class="dt">${prettyDate(e)}${rl ? ` · <i class="ti ti-refresh"></i> ${rl}` : ''}</div>
        ${isPast && e.repeat?.mode === 'manual' ? `<button class="renew" data-renew="${e.id}">جدّد</button>` : ''}
      </div>
      <div class="num"><b class="${cd.small ? 'sm' : ''}">${cd.big}</b>${cd.unit ? `<span>${cd.unit}</span>` : ''}</div>
    </div>`;
  }).join('');
}

function openEditor(id, opts = {}) {
  const src = id ? events[id] : null;
  const st = {
    title: src?.title || '',
    subtitle: src?.subtitle || '',
    date: opts.date || src?.date || todayYMD(),
    time: src?.time || '',
    hasTime: !!src?.time,
    category: src?.category || (filter !== 'all' ? filter : 'personal'),
    icon: src?.icon || null,
    showHours: !!src?.showHours,
    alerts: src?.alerts ? [...src.alerts] : [30, 7, 1],
    repeat: src?.repeat ? { ...src.repeat } : { mode: 'none', every: 1, unit: 'year' }
  };
  if (!st.icon) st.icon = { t: 'ti', v: catById(st.category).icon };
  let iconTouched = !!src?.icon;

  const host = $('#sheetHost');
  function draw() {
    const prevScroll = host.querySelector('.sheet')?.scrollTop || 0;
    const c = catById(st.category);
    host.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">
      <div class="shead">
        <button class="round" id="xBtn" aria-label="إغلاق"><i class="ti ti-x"></i></button>
        <h2>${opts.renew ? 'تجديد الموعد' : id ? 'تعديل الموعد' : 'موعد جديد'}</h2>
        <button class="round save" id="okBtn" aria-label="حفظ"><i class="ti ti-check"></i></button>
      </div>

      <div class="box"><div class="titlebox">
        <button class="iconbtn" id="pickIcon" style="--c:${c.color}" aria-label="اختر أيقونة">${iconHTML(st.icon)}</button>
        <div class="f">
          <input class="t" id="fTitle" placeholder="اسم الموعد" value="${esc(st.title)}" maxlength="60">
          <input class="s" id="fSub" placeholder="وصف (اختياري)" value="${esc(st.subtitle)}" maxlength="80">
        </div>
      </div></div>
      <p class="err hidden" id="errTitle">اكتب اسم الموعد</p>

      <div class="box">
        <div class="row"><label for="fDate">التاريخ</label><input type="date" id="fDate" value="${st.date}"></div>
        <div class="row"><span class="lbl" style="margin:0">إضافة وقت</span><button class="switch ${st.hasTime ? 'on' : ''}" id="swTime" aria-label="إضافة وقت"></button></div>
        ${st.hasTime ? `<div class="row"><label for="fTime">الوقت</label><input type="time" id="fTime" value="${st.time || '09:00'}"></div>` : ''}
        <div class="row"><span class="lbl" style="margin:0">العرض بالساعات</span><button class="switch ${st.showHours ? 'on' : ''}" id="swHours" aria-label="العرض بالساعات"></button></div>
      </div>

      <span class="lbl">التصنيف</span>
      <div class="wrap" id="catWrap">${CATS.map(k => `<button class="chip ${st.category === k.id ? 'on' : ''}" data-cat="${k.id}"><span class="dot" style="background:${k.color}"></span>${k.name}</button>`).join('')}</div>

      <span class="lbl">التنبيهات</span>
      <div class="wrap" id="alWrap">${ALERT_OPTS.map(a => `<button class="chip ${st.alerts.includes(a.d) ? 'on' : ''}" data-al="${a.d}">${a.n}</button>`).join('')}</div>
      <p class="hint">الإشعارات نفسها بتشتغل في مرحلة قادمة، واختياراتك محفوظة من الحين.</p>

      <span class="lbl">التكرار</span>
      <div class="segfull" id="repSeg">
        <button data-rep="none" class="${st.repeat.mode === 'none' ? 'on' : ''}">بدون</button>
        <button data-rep="auto" class="${st.repeat.mode === 'auto' ? 'on' : ''}">تلقائي</button>
        <button data-rep="manual" class="${st.repeat.mode === 'manual' ? 'on' : ''}">يدوي</button>
      </div>
      ${st.repeat.mode !== 'none' ? `<div class="box"><div class="row">
        <label>${st.repeat.mode === 'auto' ? 'يتجدد كل' : 'المدة المعتادة'}</label>
        <div style="display:flex;gap:8px">
          <input type="number" id="fEvery" min="1" max="99" step="1" value="${st.repeat.every}">
          <select id="fUnit">${Object.entries(UNITS).map(([k, v]) => `<option value="${k}" ${st.repeat.unit === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
        </div></div></div>
        <p class="hint">${st.repeat.mode === 'auto'
          ? 'أول ما يمر الموعد، يبدأ العد للدورة الجاية تلقائياً.'
          : 'إذا مر الموعد ينتقل لـ"منتهي" ويطلع لك زر جدّد، ويقترح التاريخ الجاي حسب المدة.'}</p>` : ''}

      ${id ? '<button class="del" id="delBtn">حذف الموعد</button>' : ''}
    </div></div>`;
    host.querySelector('.sheet').scrollTop = prevScroll;
    bind();
  }

  function readInputs() {
    st.title = $('#fTitle').value.trim();
    st.subtitle = $('#fSub').value.trim();
    st.date = $('#fDate').value || st.date;
    if (st.hasTime && $('#fTime')) st.time = $('#fTime').value;
    if ($('#fEvery')) st.repeat.every = Math.max(1, Math.min(99, parseInt($('#fEvery').value, 10) || 1));
    if ($('#fUnit')) st.repeat.unit = $('#fUnit').value;
  }

  function bind() {
    $('#ov').addEventListener('click', ev => { if (ev.target.id === 'ov') close(); });
    $('#xBtn').onclick = close;
    $('#swTime').onclick = () => { readInputs(); st.hasTime = !st.hasTime; if (!st.hasTime) st.time = ''; draw(); };
    $('#swHours').onclick = () => { readInputs(); st.showHours = !st.showHours; draw(); };
    $('#catWrap').onclick = ev => {
      const b = ev.target.closest('[data-cat]'); if (!b) return;
      readInputs(); st.category = b.dataset.cat;
      if (!iconTouched) st.icon = { t: 'ti', v: catById(st.category).icon };
      draw();
    };
    $('#alWrap').onclick = ev => {
      const b = ev.target.closest('[data-al]'); if (!b) return;
      readInputs();
      const d = Number(b.dataset.al);
      st.alerts = st.alerts.includes(d) ? st.alerts.filter(x => x !== d) : [...st.alerts, d].sort((a, b) => b - a);
      draw();
    };
    $('#repSeg').onclick = ev => {
      const b = ev.target.closest('[data-rep]'); if (!b) return;
      readInputs(); st.repeat.mode = b.dataset.rep; draw();
    };
    $('#fTitle').oninput = () => $('#errTitle').classList.add('hidden');
    $('#pickIcon').onclick = () => {
      readInputs();
      openIconPicker(st.icon, catById(st.category).color, ic => { st.icon = ic; iconTouched = true; draw(); });
    };
    if ($('#delBtn')) $('#delBtn').onclick = async () => {
      if (!confirm(`تحذف "${events[id]?.title}" نهائياً؟`)) return;
      await remove(ref(db, `users/${uid}/events/${id}`));
      close(); toast('انحذف الموعد');
    };
    $('#okBtn').onclick = async () => {
      readInputs();
      if (!st.title) { $('#errTitle').classList.remove('hidden'); $('#fTitle').focus(); return; }
      const data = {
        title: st.title,
        subtitle: st.subtitle || null,
        date: st.date,
        time: st.hasTime && st.time ? st.time : null,
        category: st.category,
        icon: st.icon,
        showHours: st.showHours,
        alerts: st.alerts,
        repeat: st.repeat.mode === 'none' ? { mode: 'none' } : { mode: st.repeat.mode, every: st.repeat.every, unit: st.repeat.unit },
        updatedAt: Date.now()
      };
      try {
        if (id) await update(ref(db, `users/${uid}/events/${id}`), data);
        else await set(push(ref(db, `users/${uid}/events`)), { ...data, createdAt: Date.now() });
        close(); toast(opts.renew ? 'تجدد الموعد' : 'انحفظ الموعد');
      } catch (err) { alert('ما انحفظ: ' + err.message); }
    };
  }

  function close() { host.innerHTML = ''; }
  draw();
}

function openIconPicker(current, color, onPick) {
  const host = document.createElement('div');
  document.body.appendChild(host);
  let mode = current?.t === 'em' ? 'em' : 'ti';
  function draw() {
    host.innerHTML = `<div class="overlay" id="pov" style="z-index:55"><div class="sheet">
      <div class="shead">
        <button class="round" id="pX" aria-label="رجوع"><i class="ti ti-arrow-right"></i></button>
        <h2>الأيقونة</h2><span style="width:40px"></span>
      </div>
      <div class="ptabs">
        <button data-m="ti" class="${mode === 'ti' ? 'on' : ''}">أيقونات</button>
        <button data-m="em" class="${mode === 'em' ? 'on' : ''}">إيموجي</button>
      </div>
      ${mode === 'ti' ? `
        <div class="psec">عائلة</div>
        <div class="pgrid">${FAMILY.map(f => `<button data-em="${f.e}" class="${current?.v === f.e ? 'on' : ''}"><span>${f.e}</span><small>${f.n}</small></button>`).join('')}</div>
        ${LIB.map(s => `<div class="psec">${s.sec}</div><div class="pgrid">${s.items.map(n =>
          `<button data-ti="${n}" class="${current?.t === 'ti' && current.v === n ? 'on' : ''}" style="color:${color}"><i class="ti ti-${n}"></i></button>`).join('')}</div>`).join('')}
      ` : `
        <p class="hint">اكتب أي إيموجي من الكيبورد</p>
        <input class="emoji-in" id="emIn" value="${current?.t === 'em' ? esc(current.v) : ''}" placeholder="🙂" maxlength="16">
        <button class="btn-main" id="emOk" style="width:100%;justify-content:center;margin-top:12px">استخدمه</button>
        <p class="err hidden" id="emErr" style="margin-top:10px">اكتب إيموجي أول</p>
      `}
    </div></div>`;
    host.querySelector('#pX').onclick = close;
    host.querySelector('#pov').addEventListener('click', ev => { if (ev.target.id === 'pov') close(); });
    host.querySelector('.ptabs').onclick = ev => { const b = ev.target.closest('[data-m]'); if (b) { mode = b.dataset.m; draw(); } };
    host.querySelectorAll('[data-ti]').forEach(b => b.onclick = () => { onPick({ t: 'ti', v: b.dataset.ti }); close(); });
    host.querySelectorAll('[data-em]').forEach(b => b.onclick = () => { onPick({ t: 'em', v: b.dataset.em }); close(); });
    const ok = host.querySelector('#emOk');
    if (ok) {
      const inp = host.querySelector('#emIn');
      inp.oninput = () => host.querySelector('#emErr').classList.add('hidden');
      ok.onclick = () => {
        const v = inp.value.trim();
        if (!v) { host.querySelector('#emErr').classList.remove('hidden'); return; }
        const seg = typeof Intl.Segmenter === 'function' ? [...new Intl.Segmenter().segment(v)][0].segment : [...v][0];
        onPick({ t: 'em', v: seg }); close();
      };
    }
  }
  function close() { host.remove(); }
  draw();
}

$('#filters').onclick = ev => { const b = ev.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; renderFilters(); render(); };
$('#tabUp').onclick = () => { tab = 'up'; $('#tabUp').classList.add('on'); $('#tabPast').classList.remove('on'); render(); };
$('#tabPast').onclick = () => { tab = 'past'; $('#tabPast').classList.add('on'); $('#tabUp').classList.remove('on'); render(); };
$('#addBtn').onclick = () => openEditor(null);
$('#searchBtn').onclick = () => {
  const r = $('#searchRow');
  r.classList.toggle('hidden');
  if (!r.classList.contains('hidden')) $('#searchIn').focus();
  else { query = ''; $('#searchIn').value = ''; render(); }
};
$('#searchIn').oninput = ev => { query = ev.target.value.trim(); render(); };
$('#list').addEventListener('click', ev => {
  const rn = ev.target.closest('[data-renew]');
  if (rn) {
    ev.stopPropagation();
    const e = events[rn.dataset.renew];
    let d = addInterval(e.date, e.repeat?.every || 1, e.repeat?.unit || 'year');
    while (dayDiff(todayYMD(), d) < 0) d = addInterval(d, e.repeat?.every || 1, e.repeat?.unit || 'year');
    openEditor(rn.dataset.renew, { date: d, renew: true });
    return;
  }
  const card = ev.target.closest('[data-id]');
  if (card) openEditor(card.dataset.id);
});
$('#list').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { const card = ev.target.closest('[data-id]'); if (card) openEditor(card.dataset.id); }
});
$('#settingsBtn').onclick = async () => {
  const email = auth.currentUser?.email || '';
  if (confirm(`مسجل بـ ${email}\n\nتبي تسجل خروج؟`)) await signOut(auth);
};

$('#loginBtn').onclick = async () => {
  $('#loginErr').classList.add('hidden');
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      await signInWithRedirect(auth, provider);
    } else if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
      $('#loginErr').textContent = 'ما قدرنا ندخلك: ' + err.message;
      $('#loginErr').classList.remove('hidden');
    }
  }
};
getRedirectResult(auth).catch(() => {});

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    uid = null; events = {};
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    return;
  }
  uid = user.uid;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderFilters();
  $('#list').innerHTML = '<div class="empty"><i class="ti ti-loader-2"></i>جاري التحميل</div>';
  unsub = onValue(ref(db, `users/${uid}/events`), snap => {
    events = snap.val() || {};
    rollAutoEvents();
    render();
  }, err => { $('#list').innerHTML = `<div class="empty"><i class="ti ti-alert-triangle"></i>ما قدرنا نقرأ البيانات: ${esc(err.message)}</div>`; });
});

let lastDay = todayYMD();
setInterval(() => { if (todayYMD() !== lastDay) { lastDay = todayYMD(); if (uid) { rollAutoEvents(); render(); } } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && uid) { rollAutoEvents(); render(); } });

const swReady = 'serviceWorker' in navigator ? navigator.serviceWorker.register('sw.js').catch(() => null) : Promise.resolve(null);
let messaging = null;
isSupported().then(ok => {
  if (!ok) return;
  messaging = getMessaging(fbApp);
  onMessage(messaging, p => toast((p.notification?.title || 'تنبيه') + (p.notification?.body ? ' — ' + p.notification.body : '')));
}).catch(() => {});

function setBell(on) {
  const b = $('#notifBtn');
  b.classList.toggle('on', on);
  b.innerHTML = `<i class="ti ti-${on ? 'bell-ringing' : 'bell-off'}"></i>`;
}
function refreshBell() {
  setBell(typeof Notification !== 'undefined' && Notification.permission === 'granted' && !!localStorage.getItem('mycd-token'));
}

async function enableNotifications() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (isIOS && !standalone) { alert('على الآيفون لازم تفتح التطبيق من أيقونته على الشاشة الرئيسية عشان تشتغل الإشعارات.\n\nمن Safari: زر المشاركة ← Add to Home Screen'); return; }
  if (!messaging || typeof Notification === 'undefined') { alert('هذا المتصفح ما يدعم الإشعارات.'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { alert('الإشعارات مرفوضة. تقدر تفعّلها من إعدادات الجوال ← الإشعارات ← My Countdown.'); refreshBell(); return; }
  try {
    const reg = await swReady;
    await navigator.serviceWorker.ready;
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg || undefined });
    if (!token) throw new Error('ما رجع رمز للجهاز');
    const key = token.replace(/[.#$\[\]\/]/g, '_').slice(-40);
    await set(ref(db, `users/${uid}/tokens/${key}`), { token, device: isIOS ? 'iPhone' : navigator.platform || 'web', at: Date.now() });
    localStorage.setItem('mycd-token', key);
    refreshBell();
    toast('تفعّلت الإشعارات على هذا الجهاز');
  } catch (err) {
    alert('ما قدرنا نفعّل الإشعارات: ' + err.message);
  }
}

$('#notifBtn').onclick = async () => {
  if ($('#notifBtn').classList.contains('on')) {
    if (confirm('الإشعارات مفعّلة على هذا الجهاز ✅\n\nتبي تعيد التفعيل (مفيد لو تغيّر شي)؟')) enableNotifications();
    return;
  }
  enableNotifications();
};
refreshBell();
</script>
</body>
</html>
